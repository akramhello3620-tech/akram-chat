<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer by Akram - Secure Messenger</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #74b9ff, #a29bfe); height: 100vh; display: flex; justify-content: center; align-items: center; }
        body.dark-mode { background: linear-gradient(135deg, #2d3436, #1e272e); }
        .chat-container { width: 100%; max-width: 450px; height: 94vh; background: #fff; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; margin-bottom: 20px; }
        body.dark-mode .chat-container { background: #1e1e1e; color: #f5f6fa; }
        .chat-header { background: #075e54; color: white; padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }
        body.dark-mode .chat-header { background: #2f3640; }
        .chat-title-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold; }
        .header-controls { display: flex; gap: 4px; align-items: center; }
        .theme-btn, .clear-btn { font-size: 0.6rem; padding: 3px 6px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .theme-btn { background: #f1f2f6; color: #333; }
        .clear-btn { background: #ff4757; color: white; }
        .sub-nav-bar { display: flex; gap: 4px; }
        .sub-nav-bar button { flex: 1; padding: 4px; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 0.75rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .sub-nav-bar button.active { background: #25d366; color: #000; }
        .screen-section { display: none; flex: 1; padding: 15px; background: #efeae2; flex-direction: column; overflow-y: auto; gap: 12px; }
        body.dark-mode .screen-section { background: #121212; }
        .screen-section.active { display: flex; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; background: #efeae2; display: flex; flex-direction: column; gap: 8px; }
        body.dark-mode .chat-messages { background: #121212; }
        .message { max-width: 78%; padding: 7px 9px; border-radius: 8px; font-size: 0.85rem; position: relative; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .message.incoming { background: #ffffff; color: #000; align-self: flex-start; border-top-left-radius: 0; }
        body.dark-mode .message.incoming { background: #2f3640; color: #f5f6fa; }
        .message.outgoing { background: #dcf8c6; color: #000; align-self: flex-end; border-top-right-radius: 0; }
        body.dark-mode .message.outgoing { background: #00b894; color: #fff; }
        .msg-actions { display: flex; gap: 6px; margin-top: 4px; font-size: 0.7rem; align-items: center; }
        .msg-actions button { background: none; border: none; cursor: pointer; font-weight: bold; }
        .report-btn { color: #8e44ad; }
        .block-btn { color: #c0392b; }
        .legal-footer { padding: 8px; font-size: 0.65rem; color: #666; text-align: center; border-top: 1px solid #ddd; background: #f9f9f9; }
        body.dark-mode .legal-footer { background: #1a1a1a; color: #aaa; border-color: #333; }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-title-row">
                <span>Chat with Akram</span>
                <div class="header-controls">
                    <button class="theme-btn" onclick="toggleTheme()">Dark</button>
                    <button class="clear-btn" onclick="clearChat()">Clear</button>
                </div>
            </div>
            <div class="sub-nav-bar">
                <button class="active" onclick="switchTab('chats')">Chats</button>
                <button onclick="switchTab('contacts')">Contacts</button>
                <button onclick="switchTab('status')">Status</button>
                <button onclick="switchTab('profile')">Profile</button>
            </div>
        </div>

        <!-- Chats Section -->
        <div id="chats-screen" class="screen-section active chat-messages">
            <div class="message incoming">
                <div>Hiii</div>
                <div class="msg-actions">
                    <span style="color: blue; cursor: pointer;" onclick="react('like')">Like: 0</span> | 
                    <span style="color: red; cursor: pointer;" onclick="react('love')">Love: 0</span> | 
                    <span style="color: orange; cursor: pointer;" onclick="react('smile')">Smile: 0</span>
                    <button style="color: red;" onclick="deleteMsg(this)">Delete</button>
                    <button class="report-btn" onclick="reportUser()">Report</button>
                    <button class="block-btn" onclick="blockUser()">Block</button>
                </div>
            </div>
        </div>

        <!-- Contacts Section -->
        <div id="contacts-screen" class="screen-section">
            <p>Go to 'Contacts' to search friends and start private chat!</p>
        </div>

        <!-- Status Section -->
        <div id="status-screen" class="screen-section">
            <p>Status updates will appear here.</p>
        </div>

        <!-- Profile Section -->
        <div id="profile-screen" class="screen-section">
            <p>Developer: Akram</p>
        </div>

        <!-- Legal Disclaimer Footer -->
        <div class="legal-footer">
            Disclaimer: Yeh ek personal/educational app hai. Misuse ke liye user khud zimmedaar hai.
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.screen-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sub-nav-bar button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName + '-screen').classList.add('active');
            event.target.classList.add('active');
        }

        function deleteMsg(btn) {
            btn.closest('.message').remove();
        }

        function react(type) {
            alert(type + ' reaction added!');
        }

        function reportUser() {
            const reason = prompt("Kripya report karne ka karan batayein (Jaise: Spam, Abuse):");
            if (reason) {
                alert("User ko report kar diya gaya hai. Admin iski jaanch karega.");
            }
        }

        function blockUser() {
            if (confirm("Kya aap waqai is user ko block karna chahte hain?")) {
                alert("User block ho chuka hai. Ab yeh aapse chat nahi kar payega.");
            }
        }

        function clearChat() {
            if(confirm("Saari chats clear karni hain?")) {
                document.getElementById('chats-screen').innerHTML = '';
            }
        }
    </script>
</body>
</html>
