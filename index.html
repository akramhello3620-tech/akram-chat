<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akram Chatting - Developed by Akram</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        html, body { width: 100%; height: 100%; background: #121b22; color: #e1e8ed; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .app-container { width: 100%; max-width: 450px; background: #111b21; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }

        /* Login Screen */
        .login-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 30px; justify-content: center; align-items: center; text-align: center; display: flex; flex-direction: column; background: #111b21; color: #e1e8ed; z-index: 500; }
        .login-container h2 { margin-bottom: 5px; color: #00a884; font-size: 28px; }
        .developer-tag { font-size: 13px; color: #00a884; margin-bottom: 25px; font-weight: bold; letter-spacing: 1.5px; background: #1f2c34; padding: 6px 15px; border-radius: 20px; border: 1px solid #2a3942; }
        .login-container input { width: 100%; padding: 14px; margin-bottom: 15px; background: #222d34; border: 1px solid #2a3942; border-radius: 8px; font-size: 16px; color: white; outline: none; }
        .login-container button { width: 100%; padding: 14px; background: #00a884; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .login-container button:hover { background: #008f72; }

        /* App Header */
        .wa-header { background: #1f2c34; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; color: #e1e8ed; font-size: 18px; font-weight: bold; flex-shrink: 0; height: 60px; }
        .dev-badge-header { font-size: 10px; color: #00a884; display: block; font-weight: normal; }

        /* Chat List Screen */
        #homeScreen { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .chat-list { flex: 1; overflow-y: auto; background: #111b21; width: 100%; }
        .chat-item { display: flex; align-items: center; padding: 15px; gap: 15px; cursor: pointer; border-bottom: 1px solid #222d34; }
        .chat-item:hover { background: #202c33; }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; font-weight: bold; overflow: hidden; flex-shrink: 0; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name-time { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .chat-name { font-size: 16px; color: #e1e8ed; font-weight: 500; }
        .chat-time { font-size: 12px; color: #8696a0; }
        .chat-last-msg { font-size: 13px; color: #8696a0; }

        /* Bottom Nav */
        .wa-nav { background: #1f2c34; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222d34; flex-shrink: 0; height: 55px; }
        .nav-item { color: #8696a0; text-align: center; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .nav-item.active { color: #00a884; font-weight: bold; }

        /* Chat Room Screen */
        #chatRoomScreen { display: flex; flex-direction: column; height: 100%; width: 100%; background: #0b141a; position: absolute; top: 0; left: 0; z-index: 200; }
        .room-header { background: #1f2c34; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; color: #fff; flex-shrink: 0; height: 60px; }
        .room-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        .room-avatar { width: 40px; height: 40px; border-radius: 50%; background: #00a884; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; flex-shrink: 0; }
        .room-title { font-size: 16px; font-weight: 500; }
        .room-bio { font-size: 11px; color: #8696a0; }
        .room-actions { display: flex; gap: 15px; align-items: center; font-size: 18px; cursor: pointer; }
        
        .room-messages { flex: 1; padding: 15px; overflow-y: auto; background: #0b141a; display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .message { max-width: 75%; padding: 10px; border-radius: 8px; font-size: 14px; position: relative; word-break: break-word; }
        .message.sent { background: #005c4b; color: #e1e8ed; align-self: flex-end; }
        .message.received { background: #202c33; color: #e1e8ed; align-self: flex-start; }
        
        .message-time { font-size: 10px; color: #8696a0; text-align: right; margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 3px; }
        .double-tick { color: #53bdeb; font-weight: bold; font-size: 12px; }

        .chat-input-area { background: #1f2c34; padding: 10px 15px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; height: 65px; width: 100%; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px 15px; border: none; border-radius: 20px; outline: none; font-size: 14px; background: #2a3942; color: #fff; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #8696a0; padding: 5px; flex-shrink: 0; }
        .chat-input-area button.send-btn { background: #00a884; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

        /* Profile Modal */
        .profile-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111b21; z-index: 300; display: flex; flex-direction: column; padding: 20px; }
        .profile-header { display: flex; align-items: center; gap: 15px; color: white; font-size: 18px; margin-bottom: 30px; }
        .profile-pic-container { text-align: center; margin-bottom: 30px; }
        .profile-big-avatar { width: 120px; height: 120px; border-radius: 50%; background: #00a884; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; overflow: hidden; position: relative; }
        .profile-big-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-input-group { margin-bottom: 20px; }
        .profile-input-group label { display: block; color: #00a884; font-size: 13px; margin-bottom: 5px; }
        .profile-input-group input { width: 100%; padding: 12px; background: #222d34; border: 1px solid #2a3942; border-radius: 8px; color: white; font-size: 15px; outline: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Login Screen -->
        <div id="loginScreen" class="login-container">
            <h2>Akram Chatting</h2>
            <div class="developer-tag">⚡ DEVELOPED BY AKRAM ⚡</div>
            <p>मोबाइल नंबर दर्ज करके चैट शुरू करें</p>
            <input type="text" id="phoneNumber" placeholder="अपना मोबाइल नंबर दर्ज करें">
            <div id="pinSection" class="hidden">
                <input type="password" id="secretPin" placeholder="सीक्रेट पिन (1234) दर्ज करें">
                <button onclick="verifyLogin()">Login to Chat</button>
            </div>
            <button id="nextBtn" onclick="checkNumber()">Next</button>
            <p id="statusMsg" style="margin-top: 15px; color: #ff5c5c; font-size: 14px;"></p>
        </div>

        <!-- Chat List Screen -->
        <div id="homeScreen" class="hidden">
            <div class="wa-header">
                <div>
                    Akram Chatting
                    <span class="dev-badge-header">Developed by Akram</span>
                </div>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <span onclick="openProfile()" title="Profile & DP" style="font-size: 20px; cursor: pointer;">👤</span>
                    <span onclick="logout()" title="Logout" style="font-size: 12px; cursor: pointer; background: #d9534f; padding: 4px 8px; border-radius: 4px; color: white;">Logout</span>
                </div>
            </div>

            <div class="chat-list" id="chatListContainer"></div>

            <div class="wa-nav">
                <div class="nav-item active"><span>💬</span>Chats</div>
                <div class="nav-item"><span>🔄</span>Updates</div>
                <div class="nav-item"><span>👥</span>Communities</div>
                <div class="nav-item"><span>📞</span>Calls</div>
            </div>
        </div>

        <!-- Profile Settings Screen -->
        <div id="profileScreen" class="profile-modal hidden">
            <div class="profile-header">
                <button class="back-btn" onclick="closeProfile()">❮</button>
                <span>प्रोफाइल, डीपी और बायो</span>
            </div>
            <div class="profile-pic-container">
                <div class="profile-big-avatar" id="myAvatarPreview">
                    <span>अ</span>
                </div>
                <input type="file" id="dpInput" accept="image/*" style="display: none;" onchange="updateProfilePic(event)">
                <button onclick="document.getElementById('dpInput').click()" style="background: #00a884; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px;">अपनी डीपी (DP) बदलें</button>
            </div>
            <div class="profile-input-group">
                <label>आपका नाम</label>
                <input type="text" id="myNameInput" placeholder="अपना नाम लिखें">
            </div>
            <div class="profile-input-group">
                <label>आपका बायो (Bio / About)</label>
                <input type="text" id="myBioInput" placeholder="जैसे: Available / Busy">
            </div>
            <button onclick="saveProfile()" style="width: 100%; padding: 14px; background: #00a884; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; font-weight: bold;">सेव करें</button>
        </div>

        <!-- Individual Chat Room Screen -->
        <div id="chatRoomScreen" class="chat-room hidden">
            <div class="room-header">
                <div class="room-header-left">
                    <button class="back-btn" onclick="closeChat()">❮</button>
                    <div class="room-avatar" id="roomAvatar">💬</div>
                    <div>
                        <div class="room-title" id="roomTitle">Akram Global Live Chat</div>
                        <div class="room-bio" id="roomBio">ऑनलाइन लाइव चैट</div>
                    </div>
                </div>
                <div class="room-actions">
                    <span onclick="startAudioCall()" title="वॉइस कॉल करें">📞</span>
                    <span onclick="startVideoCall()" title="वीडियो कॉल करें">📹</span>
                </div>
            </div>
            
            <div class="room-messages" id="chatMessages"></div>

            <div class="chat-input-area">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="sendImage(event)">
                
                <button class="icon-btn" onclick="document.getElementById('cameraInput').click()" title="कैमरे से फोटो खींचें">📷</button>
                <button class="icon-btn" onclick="startVoiceRecording()" title="वॉइस रिकॉर्डिंग">🎙️</button>
                <input type="text" id="messageInput" placeholder="Message" onkeypress="checkEnter(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        const SECRET_PIN = "1234"; 
        let currentPhone = "";
        let currentUser = { name: "User", bio: "Available" };
        let currentChatRoom = "akram_global_live_chat_room_v1";
        let messageListener = null;

        window.onload = function() {
            // नोटिफिकेशन की परमिशन मांगना ताकि मैसेज आते ही ऊपर अलर्ट मिले
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            const savedPhone = localStorage.getItem("akram_chat_user");
            if (savedPhone) {
                currentPhone = savedPhone;
                loadUserProfileFromStorage();
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('homeScreen').classList.remove('hidden');
                renderChatList();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        };

        function checkNumber() {
            const phone = document.getElementById('phoneNumber').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            if (!phone) { statusMsg.innerText = "कृपया अपना मोबाइल नंबर दर्ज करें!"; return; }
            
            statusMsg.innerText = "";
            document.getElementById('phoneNumber').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('pinSection').classList.remove('hidden');
        }

        function verifyLogin() {
            const pin = document.getElementById('secretPin').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const phone = document.getElementById('phoneNumber').value.trim();
            
            if (pin === SECRET_PIN) {
                localStorage.setItem("akram_chat_user", phone);
                currentPhone = phone;
                
                if(!localStorage.getItem("name_" + currentPhone)) {
                    localStorage.setItem("name_" + currentPhone, "User " + phone.slice(-4));
                }
                loadUserProfileFromStorage();

                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('homeScreen').classList.remove('hidden');
                renderChatList();
            } else {
                statusMsg.innerText = "गलत पिन! (डिफ़ॉल्ट पिन: 1234)";
            }
        }

        function renderChatList() {
            const container = document.getElementById('chatListContainer');
            container.innerHTML = '';
            
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.onclick = () => openChat();
            
            item.innerHTML = `
                <div class="chat-avatar">💬</div>
                <div class="chat-info">
                    <div class="chat-name-time">
                        <span class="chat-name">Akram Global Live Chat</span>
                        <span class="chat-time">Online</span>
                    </div>
                    <div class="chat-last-msg">यहाँ क्लिक करके तुरंत बात करें</div>
                </div>
            `;
            container.appendChild(item);
        }

        function openChat() {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('chatRoomScreen').classList.remove('hidden');
            listenToMessages();
        }

        function closeChat() {
            if (messageListener) {
                db.ref('chats/' + currentChatRoom).off('child_added', messageListener);
            }
            document.getElementById('chatRoomScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            renderChatList();
        }

        function openProfile() {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('profileScreen').classList.remove('hidden');
            document.getElementById('myNameInput').value = currentUser.name;
            document.getElementById('myBioInput').value = currentUser.bio;
            
            const savedDP = localStorage.getItem("dp_" + currentPhone);
            const preview = document.getElementById('myAvatarPreview');
            if (savedDP) {
                preview.innerHTML = `<img src="${savedDP}">`;
            } else {
                preview.innerHTML = `<span>${currentUser.name.charAt(0)}</span>`;
            }
        }

        function closeProfile() {
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            renderChatList();
        }

        function updateProfilePic(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    localStorage.setItem("dp_" + currentPhone, e.target.result);
                    document.getElementById('myAvatarPreview').innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveProfile() {
            const newName = document.getElementById('myNameInput').value.trim();
            const newBio = document.getElementById('myBioInput').value.trim();
            if (newName) currentUser.name = newName;
            if (newBio) currentUser.bio = newBio;
            
            localStorage.setItem("name_" + currentPhone, currentUser.name);
            localStorage.setItem("bio_" + currentPhone, currentUser.bio);
            closeProfile();
        }

        function loadUserProfileFromStorage() {
            const savedName = localStorage.getItem("name_" + currentPhone);
            const savedBio = localStorage.getItem("bio_" + currentPhone);
            if (savedName) currentUser.name = savedName;
            if (savedBio) currentUser.bio = savedBio;
        }

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            const msgData = {
                sender: currentUser.name,
                senderPhone: currentPhone,
                text: text,
                time: getCurrentTime(),
                type: 'text'
            };

            db.ref('chats/' + currentChatRoom).push(msgData);
            input.value = '';
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const msgData = {
                        sender: currentUser.name,
                        senderPhone: currentPhone,
                        text: e.target.result,
                        time: getCurrentTime(),
                        type: 'image'
                    };
                    db.ref('chats/' + currentChatRoom).push(msgData);
                };
                reader.readAsDataURL(file);
            }
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function startVoiceRecording() {
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            const msgData = {
                                sender: currentUser.name,
                                senderPhone: currentPhone,
                                text: reader.result,
                                time: getCurrentTime(),
                                type: 'audio'
                            };
                            db.ref('chats/' + currentChatRoom).push(msgData);
                        };
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    alert("वॉइस रिकॉर्डिंग शुरू! बंद करने के लिए दोबारा क्लिक करें।");
                }).catch(err => alert("माइक्रोफोन की अनुमति नहीं मिली!"));
            } else {
                mediaRecorder.stop();
                isRecording = false;
                alert("वॉइस नोट भेज दिया गया है!");
            }
        }

        function startAudioCall() {
            let targetPhone = prompt("जिस दोस्त को वॉइस कॉल करना है उसका मोबाइल नंबर दर्ज करें:");
            if (targetPhone) {
                window.location.href = "tel:" + targetPhone;
            }
        }

        function startVideoCall() {
            let targetPhone = prompt("जिस दोस्त को वीडियो कॉल करना है उसका WhatsApp नंबर दर्ज करें (+91...):");
            if (targetPhone) {
                window.open("https://wa.me/" + targetPhone.replace(/[^0-9]/g, ''), "_blank");
            }
        }

        function listenToMessages() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';

            messageListener = db.ref('chats/' + currentChatRoom).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const msgDiv = document.createElement('div');
                const isSent = msg.senderPhone === currentPhone;
                msgDiv.className = 'message ' + (isSent ? 'sent' : 'received');

                if (msg.type === 'image') {
                    msgDiv.innerHTML = `<img src="${msg.text}" style="max-width:100%; border-radius:6px;"><div class="message-time">${msg.time} <span class="double-tick">✓✓</span></div>`;
                } else if (msg.type === 'audio') {
                    msgDiv.innerHTML = `<audio controls src="${msg.text}" style="max-width:200px;"></audio><div class="message-time">${msg.time} <span class="double-tick">✓✓</span></div>`;
                } else {
                    msgDiv.innerHTML = `<strong>${msg.sender}:</strong><br>${msg.text}<div class="message-time">${msg.time} <span class="double-tick">✓✓</span></div>`;
                }

                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // अगर मैसेज किसी दूसरे ने भेजा है और आप चैट स्क्रीन से बाहर हैं, तो नोटिफिकेशन भेजें
                if (!isSent && document.getElementById('chatRoomScreen').classList.contains('hidden')) {
                    if (Notification.permission === "granted") {
                        new Notification("नया मैसेज - " + msg.sender, { body: msg.text });
                    }
                }
            });
        }

        function checkEnter(e) {
            if(e.key === 'Enter') sendMessage();
        }

        function logout() {
            localStorage.removeItem("akram_chat_user");
            location.reload();
        }
    </script>
</body>
</html>
