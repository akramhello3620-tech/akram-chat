<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>MitraChat - Developed by Akram</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#e9edef;
    height:100vh;
    overflow:hidden;
}

button{
    border:0;
    cursor:pointer;
}

input{
    outline:none;
}

/* LOGIN */

#loginPage{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#075e54,#128c7e);
    padding:20px;
}

.loginBox{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.logo{
    width:80px;
    height:80px;
    background:#25d366;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:35px;
    margin:0 auto 15px;
}

.loginBox h1{
    color:#075e54;
    margin-bottom:7px;
}

.developer{
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:12px;
    font-size:16px;
}

.btn{
    width:100%;
    padding:14px;
    border-radius:10px;
    background:#25d366;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.btn:active{
    transform:scale(.98);
}

#otpBox{
    display:none;
    margin-top:15px;
}

#recaptcha-container{
    margin:10px 0;
}

/* APP */

#app{
    display:none;
    height:100vh;
    background:#f0f2f5;
}

.topbar{
    height:60px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.brand{
    font-size:20px;
    font-weight:bold;
}

.topActions button{
    background:transparent;
    color:white;
    font-size:21px;
    margin-left:12px;
}

.searchBox{
    padding:10px;
    background:white;
}

.searchBox input{
    width:100%;
    padding:12px 15px;
    border-radius:25px;
    border:1px solid #ddd;
    background:#f0f2f5;
    font-size:15px;
}

#usersList{
    height:calc(100vh - 120px);
    overflow:auto;
}

.userItem{
    background:white;
    display:flex;
    align-items:center;
    padding:12px 15px;
    border-bottom:1px solid #eee;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#128c7e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.userInfo{
    margin-left:12px;
    flex:1;
}

.userInfo strong{
    display:block;
    font-size:16px;
}

.userInfo small{
    color:#777;
}

.bottomNav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.bottomNav button{
    background:white;
    color:#555;
    font-size:12px;
}

.bottomNav button span{
    display:block;
    font-size:22px;
}

/* CHAT */

#chatPage{
    display:none;
    position:fixed;
    inset:0;
    background:#efeae2;
    z-index:10;
}

.chatHeader{
    height:60px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    padding:8px;
}

.backBtn{
    background:transparent;
    color:white;
    font-size:25px;
    margin-right:8px;
}

.chatAvatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#128c7e;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.chatAvatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chatUser{
    margin-left:10px;
    flex:1;
}

.chatUser strong{
    display:block;
}

.chatUser small{
    color:#d6eeee;
}

.chatActions button{
    background:transparent;
    color:white;
    font-size:20px;
    margin-left:10px;
}

.messages{
    height:calc(100vh - 120px);
    overflow:auto;
    padding:15px;
}

.message{
    max-width:78%;
    padding:9px 11px;
    margin-bottom:8px;
    border-radius:9px;
    word-wrap:break-word;
    font-size:15px;
}

.sent{
    margin-left:auto;
    background:#d9fdd3;
}

.received{
    margin-right:auto;
    background:white;
}

.messageTime{
    display:block;
    text-align:right;
    color:#777;
    font-size:10px;
    margin-top:3px;
}

.tick{
    color:#2196f3;
}

.composer{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    padding:7px;
    gap:7px;
}

.composer input{
    flex:1;
    border:0;
    border-radius:25px;
    padding:13px 16px;
    font-size:15px;
}

.composer button{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#25d366;
    color:white;
    font-size:20px;
}

/* PROFILE */

#profilePage{
    display:none;
    position:fixed;
    inset:0;
    background:#f0f2f5;
    z-index:20;
    overflow:auto;
}

.profileHeader{
    background:#075e54;
    color:white;
    padding:15px;
    font-size:20px;
}

.profileContent{
    max-width:500px;
    margin:auto;
    padding:25px;
}

.profileAvatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#128c7e;
    color:white;
    margin:0 auto 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    overflow:hidden;
}

.profileAvatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.fileBtn{
    display:block;
    width:100%;
    background:#128c7e;
    color:white;
    padding:12px;
    text-align:center;
    border-radius:10px;
    margin-bottom:15px;
}

.profileContent label{
    display:block;
    margin:12px 0 5px;
    font-weight:bold;
}

/* EMPTY */

.empty{
    padding:40px 20px;
    text-align:center;
    color:#777;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:80px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    display:none;
    z-index:100;
}
</style>
</head>

<body>

<script>

/* =====================================================
   FIREBASE CONFIG
   =====================================================

   Replace these values with your Firebase Web App config.
===================================================== */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
    "YOUR_PROJECT.firebaseapp.com",

    databaseURL:
    "https://YOUR_PROJECT-default-rtdb.firebaseio.com",

    projectId:
    "YOUR_PROJECT",

    storageBucket:
    "YOUR_PROJECT.appspot.com",

    messagingSenderId:
    "YOUR_SENDER_ID",

    appId:
    "YOUR_APP_ID"

};


/* =====================================================
   FIREBASE START
===================================================== */

let firebaseReady = false;

try{

    if(
        firebaseConfig.apiKey &&
        !firebaseConfig.apiKey.startsWith("YOUR_")
    ){

        firebase.initializeApp(firebaseConfig);

        firebaseReady = true;

    }

}catch(error){

    console.error(error);

}


/* =====================================================
   VARIABLES
===================================================== */

let confirmationResult = null;

let currentUser = null;

let currentChatUser = null;

let chatListener = null;

let usersCache = {};

let recaptchaVerifier = null;


/* =====================================================
   TOAST
===================================================== */

function toast(message){

    const box =
    document.getElementById("toast");

    box.innerText = message;

    box.style.display = "block";

    setTimeout(()=>{

        box.style.display = "none";

    },2500);

}


/* =====================================================
   PHONE FORMAT
===================================================== */

function normalizePhone(phone){

    phone = phone.trim();

    if(phone.startsWith("0")){

        phone =
        "+91" +
        phone.substring(1);

    }

    if(
        !phone.startsWith("+") &&
        phone.length === 10
    ){

        phone = "+91" + phone;

    }

    return phone;

}


/* =====================================================
   SEND OTP
===================================================== */

function sendOTP(){

    if(!firebaseReady){

        toast("Firebase config pehle add karein");

        return;

    }

    let phone =
    normalizePhone(
        document.getElementById("phone").value
    );

    if(!/^\+\d{10,15}$/.test(phone)){

        toast("Valid mobile number enter karein");

        return;

    }

    try{

        if(!recaptchaVerifier){

            recaptchaVerifier =
            new firebase.auth.RecaptchaVerifier(
                "recaptcha-container",
                {
                    size:"normal"
                }
            );

        }

        firebase.auth()
        .signInWithPhoneNumber(
            phone,
            recaptchaVerifier
        )
        .then(result=>{

            confirmationResult = result;

            document.getElementById(
                "otpBox"
            ).style.display="block";

            toast("OTP bhej diya gaya");

        })
        .catch(error=>{

            console.error(error);

            toast(error.message);

        });

    }catch(error){

        console.error(error);

        toast("OTP send nahi hua");

    }

}


/* =====================================================
   VERIFY OTP
===================================================== */

function verifyOTP(){

    const otp =
    document.getElementById("otp").value.trim();

    if(!confirmationResult){

        toast("Pehle OTP send karein");

        return;

    }

    if(otp.length < 4){

        toast("OTP enter karein");

        return;

    }

    confirmationResult
    .confirm(otp)
    .then(result=>{

        currentUser = result.user;

        afterLogin();

    })
    .catch(error=>{

        console.error(error);

        toast("Wrong OTP");

    });

}


/* =====================================================
   AFTER LOGIN
===================================================== */

function afterLogin(){

    document.getElementById(
        "loginPage"
    ).style.display="none";

    document.getElementById(
        "app"
    ).style.display="block";

    const uid =
    currentUser.uid;

    const userRef =
    firebase.database()
    .ref("users/"+uid);

    userRef.once("value")
    .then(snapshot=>{

        let data =
        snapshot.val();

        if(!data){

            data = {

                uid:uid,

                phone:
                currentUser.phoneNumber || "",

                name:"Mitra User",

                username:
                "user"+uid.substring(0,6),

                bio:"Hey there! I am using MitraChat",

                photo:"",

                online:true,

                createdAt:
                firebase.database.ServerValue.TIMESTAMP

            };

            userRef.set(data);

        }else{

            userRef.update({

                online:true,

                lastSeen:
                firebase.database.ServerValue.TIMESTAMP

            });

        }

    });

    setPresence();

    loadUsers();

}


/* =====================================================
   PRESENCE
===================================================== */

function setPresence(){

    const ref =
    firebase.database()
    .ref("users/"+currentUser.uid);

    ref.onDisconnect()
    .update({

        online:false,

        lastSeen:
        firebase.database.ServerValue.TIMESTAMP

    });

    ref.update({

        online:true

    });

}


/* =====================================================
   LOAD USERS
===================================================== */

function loadUsers(){

    firebase.database()
    .ref("users")
    .on("value",snapshot=>{

        usersCache =
        snapshot.val() || {};

        searchUsers();

    });

}


/* =====================================================
   SEARCH USERS
===================================================== */

function searchUsers(){

    const query =
    document.getElementById(
        "searchInput"
    ).value
    .toLowerCase()
    .trim();

    const list =
    document.getElementById("usersList");

    list.innerHTML="";

    let found=0;

    Object.values(usersCache)
    .forEach(user=>{

        if(
            !user.uid ||
            user.uid === currentUser.uid
        ){

            return;

        }

        const name =
        (user.name || "")
        .toLowerCase();

        const username =
        (user.username || "")
        .toLowerCase();

        const phone =
        (user.phone || "")
        .toLowerCase();

        if(
            query === "" ||
            name.includes(query) ||
            username.includes(query) ||
            phone.includes(query)
        ){

            found++;

            const item =
            document.createElement("div");

            item.className="userItem";

            item.onclick=()=>{
                openChat(user);
            };

            const avatar =
            document.createElement("div");

            avatar.className="avatar";

            if(user.photo){

                avatar.innerHTML =
                "<img src='"+user.photo+"'>";

            }else{

                avatar.innerText =
                (user.name || "U")
                .charAt(0)
                .toUpperCase();

            }

            const info =
            document.createElement("div");

            info.className="userInfo";

            info.innerHTML =
            "<strong>"+
            escapeHTML(user.name || "User")+
            "</strong>"+
            "<small>@"+
            escapeHTML(user.username || "")+
            "</small>";

            item.appendChild(avatar);

            item.appendChild(info);

            list.appendChild(item);

        }

    });


    if(found===0){

        list.innerHTML =
        '<div class="empty">No user found</div>';

    }

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(user){

    currentChatUser = user;

    document.getElementById(
        "chatPage"
    ).style.display="block";

    document.getElementById(
        "chatName"
    ).innerText =
    user.name || "User";

    const avatar =
    document.getElementById(
        "chatAvatar"
    );

    if(user.photo){

        avatar.innerHTML =
        "<img src='"+user.photo+"'>";

    }else{

        avatar.innerText =
        (user.name || "U")
        .charAt(0)
        .toUpperCase();

    }

    updateChatStatus(user);

    loadMessages();

}


/* =====================================================
   CHAT STATUS
===================================================== */

function updateChatStatus(user){

    const status =
    document.getElementById(
        "chatStatus"
    );

    if(user.online){

        status.innerText="online";

    }else{

        status.innerText="offline";

    }

}


/* =====================================================
   ROOM ID
===================================================== */

function getRoomId(uid1,uid2){

    return [uid1,uid2]
    .sort()
    .join("_");

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages(){

    const messages =
    document.getElementById(
        "messages"
    );

    messages.innerHTML="";

    if(chatListener){

        chatListener.off();

    }

    const room =
    getRoomId(
        currentUser.uid,
        currentChatUser.uid
    );

    chatListener =
    firebase.database()
    .ref("chats/"+room);

    chatListener
    .on("child_added",snapshot=>{

        const message =
        snapshot.val();

        renderMessage(
            snapshot.key,
            message
        );

    });

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(id,message){

    const container =
    document.getElementById(
        "messages"
    );

    const div =
    document.createElement("div");

    const sent =
    message.sender === currentUser.uid;

    div.className =
    "message "+
    (sent ? "sent" : "received");

    let text =
    escapeHTML(message.text || "");

    let tick="";

    if(sent){

        tick =
        message.seen
        ? '<span class="tick">✓✓</span>'
        : "✓";

    }

    div.innerHTML =
    text+
    '<span class="messageTime">'+
    formatTime(message.time)+
    " "+
    tick+
    "</span>";

    container.appendChild(div);

    container.scrollTop =
    container.scrollHeight;

    /* Mark received message as seen */

    if(
        !sent &&
        !message.seen
    ){

        firebase.database()
        .ref(
            "chats/"+
            getRoomId(
                currentUser.uid,
                currentChatUser.uid
            )+
            "/"+
            id
        )
        .update({
            seen:true
        });

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage(){

    const input =
    document.getElementById(
        "messageInput"
    );

    const text =
    input.value.trim();

    if(!text){

        return;

    }

    if(!currentChatUser){

        return;

    }

    const room =
    getRoomId(
        currentUser.uid,
        currentChatUser.uid
    );

    firebase.database()
    .ref("chats/"+room)
    .push({

        sender:
        currentUser.uid,

        receiver:
        currentChatUser.uid,

        text:text,

        type:"text",

        time:
        firebase.database.ServerValue.TIMESTAMP,

        seen:false

    })
    .then(()=>{

        input.value="";

    })
    .catch(error=>{

        console.error(error);

        toast("Message send nahi hua");

    });

}


/* =====================================================
   CLOSE CHAT
===================================================== */

function closeChat(){

    document.getElementById(
        "chatPage"
    ).style.display="none";

    if(chatListener){

        chatListener.off();

        chatListener=null;

    }

    currentChatUser=null;

}


/* =====================================================
   PROFILE
===================================================== */

function openProfile(){

    document.getElementById(
        "profilePage"
    ).style.display="block";

    firebase.database()
    .ref("users/"+currentUser.uid)
    .once("value")
    .then(snapshot=>{

        const user =
        snapshot.val() || {};

        document.getElementById(
            "profileName"
        ).value =
        user.name || "";

        document.getElementById(
            "profileUsername"
        ).value =
        user.username || "";

        document.getElementById(
            "profileBio"
        ).value =
        user.bio || "";

        const avatar =
        document.getElementById(
            "profileAvatar"
        );

        if(user.photo){

            avatar.innerHTML =
            "<img src='"+user.photo+"'>";

        }else{

            avatar.innerText =
            (user.name || "U")
            .charAt(0)
            .toUpperCase();

        }

    });

}


/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile(){

    const name =
    document.getElementById(
        "profileName"
    ).value.trim();

    const username =
    document.getElementById(
        "profileUsername"
    ).value.trim()
    .toLowerCase()
    .replace(/\s/g,"");

    const bio =
    document.getElementById(
        "profileBio"
    ).value.trim();

    if(!name){

        toast("Name enter karein");

        return;

    }

    firebase.database()
    .ref("users/"+currentUser.uid)
    .update({

        name:name,

        username:username,

        bio:bio

    })
    .then(()=>{

        toast("Profile saved");

        closeProfile();

    });

}


/* =====================================================
   PROFILE PHOTO
===================================================== */

function uploadProfilePhoto(){

    const file =
    document.getElementById(
        "photoInput"
    ).files[0];

    if(!file){

        return;

    }

    if(file.size > 3*1024*1024){

        toast("Photo 3MB se chhoti rakhein");

        return;

    }

    const reader =
    new FileReader();

    reader.onload=()=>{

        const photo =
        reader.result;

        document.getElementById(
            "profileAvatar"
        ).innerHTML =
        "<img src='"+photo+"'>";

        firebase.database()
        .ref("users/"+currentUser.uid)
        .update({

            photo:photo

        })
        .then(()=>{

            toast("Profile photo updated");

        });

    };

    reader.readAsDataURL(file);

}


/* =====================================================
   CALL
===================================================== */

function makeCall(){

    if(
        !currentChatUser ||
        !currentChatUser.phone
    ){

        toast("Phone number available nahi hai");

        return;

    }

    window.location.href =
    "tel:"+currentChatUser.phone;

}

===================================================== */

function closeProfile(){

    document.getElementById(
        "profilePage"
    ).style.display="none";

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    if(!firebaseReady){

        return;

    }

    if(
        confirm("Logout karna hai?")
    ){

        firebase.auth()
        .signOut()
        .then(()=>{

            location.reload();

        });

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent =
    text;

    return div.innerHTML;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(timestamp){

    if(!timestamp){

        return "";

    }

    const date =
    new Date(timestamp);

    return date.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   AUTH STATE
===================================================== */

if(firebaseReady){

    firebase.auth()
    .onAuthStateChanged(user=>{

        if(user){

            currentUser=user;

            afterLogin();

        }

    });

}
